# .github/workflows/ci.yml
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: sgrd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/sgrd
      # Contrato de sessão. O gate SEC-02 só dispara em NODE_ENV=production, então estes
      # valores de teste passam; não há mais segredos de JWT próprios nem senha de admin.
      REDIS_URL: redis://saga_readonly:ci-dummy@localhost:6379/0
      SAGA_JWKS_URL: http://localhost:8000/.well-known/jwks.json
      SAGA_LOGIN_URL: http://localhost:8000/login
      PORTAL_ALLOWED_REDIRECT_HOSTS: localhost
      INITIAL_ADMIN_LOGIN: ci-admin
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # O schema `auth` é do saga: a migração do Prisma cobre só o schema `sgrf`. Em CI o
      # saga não roda, então o fixture cria `auth` no banco de teste (mesma DDL de
      # saga/db/schema.sql). Sem isso as suítes que montam identidades falham com P2021.
      - run: psql "$DATABASE_URL" -f tests/fixtures/auth-schema.sql
      - run: npx vitest run
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
