# SGRF/SGRD v0.1.4 — deploy: app (imagem única, API + SPA) + Postgres.
# Porta externa via APP_PORT (default 8081). Segredos via ambiente (ver backend/.env.example).
#
# Redis e saga NÃO estão neste compose: são a infra compartilhada (`../compose.dev.yml`
# e o deploy do saga). O sgrf é verifier — sem Redis (liveness) ele rejeita com 503,
# então os defaults de REDIS_URL/SAGA_* apontam para essa infra.
name: sgrf

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: sgrd
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgrd}
      POSTGRES_DB: sgrd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgrd"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://sgrd:${DB_PASSWORD:-sgrd}@db:5432/sgrd
      SERVE_FRONTEND: "true"
      FRONTEND_DIST: /app/frontend-dist
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${APP_PORT:-8081}}
      # Contrato de sessão (docs/session-contract.md). O sgrf não assina token nem
      # define cookie próprio: a sessão é o cookie compartilhado do saga.
      REDIS_URL: ${REDIS_URL:-redis://saga_readonly:saga-dev-ro@redis:6379/0}
      SAGA_JWKS_URL: ${SAGA_JWKS_URL:-http://saga:8000/.well-known/jwks.json}
      SAGA_LOGIN_URL: ${SAGA_LOGIN_URL:-http://saga:8000/login}
      PORTAL_ALLOWED_REDIRECT_HOSTS: ${PORTAL_ALLOWED_REDIRECT_HOSTS:-localhost}
      # Seed: só o papel. A identidade é criada pelo saga no primeiro login.
      INITIAL_ADMIN_LOGIN: ${INITIAL_ADMIN_LOGIN:-ldsampaio}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SGRD <nao-responder@utfpr.edu.br>}
    volumes:
      - app-uploads:/app/uploads

volumes:
  pgdata:
  app-uploads:
